
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg1: #eef2ff;
            --bg2: #ffffff;
            --accent: #4f46e5;
            --muted: #6b7280;
            --card-radius: 16px;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:'Poppins',system-ui,Segoe UI,Roboto,Arial;
            background: linear-gradient(135deg,var(--bg1),#f8fafc);
            color:#111827;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:32px;
        }
        .profile-card{
            background:var(--bg2);
            width:100%;
            max-width:900px;
            border-radius:var(--card-radius);
            box-shadow:0 12px 30px rgba(17,24,39,0.08);
            overflow:hidden;
            display:grid;
            grid-template-columns: 320px 1fr;
        }
        .left{
            background:linear-gradient(180deg, rgba(79,70,229,0.06), rgba(99,102,241,0.03));
            padding:32px;
            text-align:center;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:14px;
        }
        .foto{
            width:160px;
            height:160px;
            border-radius:50%;
            object-fit:cover;
            border:6px solid rgba(79,70,229,0.12);
            box-shadow:0 8px 20px rgba(99,102,241,0.12);
        }
        h2{margin:6px 0 0;font-size:20px;font-weight:600}
        .job{color:var(--muted);font-size:14px;margin:0}
        .socials{display:flex;gap:8px;margin-top:8px}
        .socials a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;color:var(--accent);background:transparent;border:1px solid rgba(79,70,229,0.06);text-decoration:none}

        .right{padding:28px 32px}
        .section{margin-bottom:18px}
        .section h3{margin:0 0 8px;font-size:15px}
        table{width:100%;border-collapse:collapse}
        td{padding:8px 0;border-bottom:1px dashed #f1f5f9}
        td:first-child{width:38%;color:var(--muted);font-weight:600}

        .skills{display:flex;flex-direction:column;gap:10px}
        .skill{display:flex;flex-direction:column}
        .skill .bar{height:10px;background:#eef2ff;border-radius:999px;overflow:hidden}
        .skill .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#06b6d4)}

        .actions{display:flex;gap:10px;margin-top:12px}
        .btn{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:600}
        .btn-primary{background:var(--accent);color:white}
        .btn-ghost{background:transparent;border:1px solid #e6e9f2;color:var(--muted)}
        .screenshot{margin-top:10px;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(15,23,42,0.06)}
        .screenshot-img{width:100%;display:block;object-fit:cover;min-height:180px}

        @media (max-width:720px){
            .profile-card{grid-template-columns:1fr;max-width:420px}
            .left{padding:20px}
            .right{padding:20px}
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="left">
            <!-- Ganti link gambar dengan foto Anda -->
            <img src="https://static0.gamerantimages.com/wordpress/wp-content/uploads/2024/05/mixcollage-18-may-2024-07-28-pm-184.jpg?q=70&fit=crop&w=1440&h=990&dpr=1" alt="Foto Profil" class="foto">
            <h2>Denis Pirmansyah</h2>
            <p class="job">Web Developer Pemula</p>
            <div class="socials" aria-label="Sosial media">
                <a href="#" title="GitHub">GH</a>
                <a href="#" title="LinkedIn">in</a>
                <a href="#" title="Email">@</a>
            </div>
        </div>

        <div class="right">
            <div class="section">
                <h3>Informasi Pribadi</h3>
                <table>
                    <tr>
                        <td>Tempat, Tgl Lahir</td>
                        <td>Garut, 23 desember 2009</td>
                    </tr>
                    <tr>
                        <td>Jenis Kelamin</td>
                        <td>Laki-laki</td>
                    </tr>
                    <tr>
                        <td>Alamat</td>
                        <td>Jl. Merdeka No. 123, Garut</td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td>balabalabalalalala@gmail.com</td>
                    </tr>
                    <tr>
                        <td>Hobi</td>
                        <td>Membaca</td>
                    </tr>
                </table>
            </div>

            <div class="section">
                <h3>Keahlian</h3>
                <div class="skills">
                    <div class="skill">
                        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>HTML</span><strong>85%</strong></div>
                        <div class="bar"><i style="width:85%"></i></div>
                    </div>
                    <div class="skill">
                        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>CSS</span><strong>75%</strong></div>
                        <div class="bar"><i style="width:75%"></i></div>
                    </div>
                    <div class="skill">
                        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>JavaScript</span><strong>60%</strong></div>
                        <div class="bar"><i style="width:60%"></i></div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>Screenshot Bukti</h3>
                <div class="screenshot">
                    <img src="https://via.placeholder.com/720x420.png?text=Screenshot+Anda+di+sini" alt="Screenshot Bukti" class="screenshot-img">
                </div>
            </div>
            <div class="section">
                <div class="actions">
                    <button class="btn btn-primary">Unduh CV</button>
                    <button class="btn btn-ghost">Hubungi</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
