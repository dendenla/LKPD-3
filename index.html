<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .foto {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }
        h2 {
            margin: 10px 0 5px;
            color: #333;
        }
        p.job {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            text-align: left;
            font-size: 14px;
            border-collapse: collapse;
        }
        table td {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        table td:first-child {
            font-weight: bold;
            color: #555;
            width: 35%;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ganti link gambar dengan foto Anda -->
        <img src="https://placeholder.com" alt="Foto Profil" class="foto">
        <h2>Denis Pirmansyah</h2>
        <p class="job">Web Developer Pemula</p>
        
        <table>
            <tr>
                <td>Tempat, Tgl Lahir</td>
                <td>Garut, 1 Januari 2000</td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>Laki-laki / Perempuan</td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td>Jl. Merdeka No. 123, Garut</td>
            </tr>
            <tr>
                <td>Email</td>
                <td>email@example.com</td>
            </tr>
            <tr>
                <td>Hobi</td>
                <td>Membaca</td>
            </tr>
        </table>
    </div>

</body>
</html>
